name: Candidate recovery snapshot

on:
  push:
    branches:
      - 'work/v1.20.0-recovery-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Save tracked source and identity without credentials or workspace state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ui-spec-recovery"
          git archive --format=tar.gz --output="$RUNNER_TEMP/ui-spec-recovery/source.tar.gz" HEAD
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ui-spec-recovery'
          source = root / 'source.tar.gz'
          manifest = {
              'schema_version': 1,
              'repository': os.environ['GITHUB_REPOSITORY'],
              'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'source_archive_sha256': hashlib.sha256(source.read_bytes()).hexdigest(),
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'scope': 'Exact tracked source recovery snapshot; not an Agent experiment, visual acceptance or published release.'
          }
          (root / 'identity.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Build candidate distribution without publishing
        run: python tools/package.py
      - name: Preserve source snapshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-source-${{ github.sha }}
          path: ${{ runner.temp }}/ui-spec-recovery/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve candidate distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-distributions-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  candidate-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the exact remote candidate before main is changed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ui-spec-candidate-install"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/ui-spec-candidate-install/commit.txt"
          python tools/install_smoke.py --source "https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA}" 2>&1 | tee "$RUNNER_TEMP/ui-spec-candidate-install/remote-install.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: candidate-remote-install-${{ github.sha }}
          path: ${{ runner.temp }}/ui-spec-candidate-install/
          if-no-files-found: error
          retention-days: 30

  runtime-availability:
    # Presence only: do not reveal credentials or turn a preflight into a model run.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Record non-secret availability for the approved experiment
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, shutil
          from datetime import datetime, timezone
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ui-spec-runtime-availability'
          target.mkdir()
          available = {name: bool(os.environ.get(name)) for name in ('OPENAI_API_KEY', 'CODEX_API_KEY')}
          result = {
              'schema_version': 1,
              'observed_at_utc': datetime.now(timezone.utc).isoformat(),
              'source_commit': os.environ['GITHUB_SHA'],
              'codex_executable_present': shutil.which('codex') is not None,
              'credential_reference_present': available,
              'authenticated_execution_verified': False,
              'actual_agent_runs': 0,
              'scope': 'Runner and configured secret-reference availability only. No credential value is saved and no model is invoked.'
          }
          (target / 'availability.json').write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-runtime-availability-${{ github.sha }}
          path: ${{ runner.temp }}/ui-spec-runtime-availability/
          if-no-files-found: error
          retention-days: 30

  candidate-live-readme:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r tools/requirements-preview.txt
      - name: Use the Ubuntu archive for system dependencies
        shell: bash
        run: |
          for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources /etc/apt/apt-mirrors.txt; do
            if [[ -f "$apt_source" ]]; then
              sudo sed -i -E 's@(https?://)azure\.archive\.ubuntu\.com/ubuntu([/[:space:]]|$)@\1archive.ubuntu.com/ubuntu\2@g' "$apt_source"
            fi
          done
      - run: python -m playwright install-deps chromium
      - name: Provision the verified browser and recorder
        id: browser
        run: |
          python tools/provision_preview_browser.py \
            --output-dir "$RUNNER_TEMP/ui-spec-preview-browser" \
            --report candidate-live-readme/browser-provision.json \
            --github-output "$GITHUB_OUTPUT"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$RUNNER_TEMP/ui-spec-preview-browser" >> "$GITHUB_ENV"
      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Render the exact candidate on GitHub without publishing a tag
        run: python tools/preview_readme.py --output-dir candidate-live-readme/github --live-commit "$GITHUB_SHA" --browser-path "${{ steps.browser.outputs.browser_path }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: candidate-live-readme-${{ github.sha }}
          path: candidate-live-readme/
          if-no-files-found: error
          retention-days: 30
