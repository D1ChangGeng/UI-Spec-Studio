name: Evidence development
on:
  push:
    branches: [work/multiscale-evidence-v1.14]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: c096276527a47e20fa0cd0f4e1e81e9ac345abe2
          persist-credentials: false
      - name: Archive the unchanged review baseline
        run: git archive --format=zip --output=baseline.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-spec-1.13-baseline
          path: baseline.zip
          retention-days: 7
