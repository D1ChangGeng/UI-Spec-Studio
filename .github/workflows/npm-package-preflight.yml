name: npm package name preflight
on:
  push:
    branches:
      - feat/npm-registry-official-cli
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-name-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Probe npm's public package names (not ownership)
        shell: bash
        run: |
          set -uo pipefail
          for name in ui-spec-studio ui-spec-studio-installer; do
            echo "Checking package name: $name"
            code=0
            result=$(npm view "$name" name version --json --fetch-retries=0 --fetch-timeout=15000 2>&1) || code=$?
            if [ "$code" -eq 0 ]; then
              echo "REGISTERED $name: $result"
            elif grep -q 'E404' <<< "$result"; then
              echo "UNREGISTERED $name (candidate only; availability does not establish ownership)"
            else
              echo "REGISTRY ERROR $name: $result"
              exit 1
            fi
          done
