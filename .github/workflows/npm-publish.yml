name: Official npm CLI candidate and trusted publication

on:
  pull_request:
    paths:
      - installer/**
      - integrations/codex/**
      - skills/ui-spec/**
      - tools/package_installer.py
      - tools/installer_smoke.py
      - tools/bootstrap-npm.ps1
      - tools/npm_publish_preflight.py
      - tests/test_npm_publish_preflight.py
      - tools/npm_registry_readback.py
      - tests/test_npm_registry_readback.py
      - tools/official_npm_smoke.py
      - docs/NPM-DISTRIBUTION.md
      - README.md
      - README.zh-CN.md
      - VERSION
      - .github/workflows/npm-publish.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified VERSION through the configured npm trusted publisher
        required: true
        type: boolean
        default: false
  # After the first npm owner bootstrap and OIDC setup, every successful
  # validated main-branch GitHub release can publish npm automatically.
  workflow_run:
    workflows:
      - Validate and release
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  candidate:
    # Never run privileged publication steps based on a PR workflow result.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check official package identity
        shell: bash
        run: |
          python tools/validate_package.py
          python - <<'PY'
          import json
          from pathlib import Path
          pkg = json.loads(Path('installer/package.json').read_text(encoding='utf-8'))
          version = Path('VERSION').read_text(encoding='utf-8').strip()
          assert pkg['name'] == 'ui-spec-studio'
          assert pkg['version'] == version
          assert pkg['repository']['url'] == 'https://github.com/D1ChangGeng/UI-Spec-Studio'
          assert pkg['bin'] == {'ui-spec': 'bin/ui-spec.mjs'}
          print(f"Official package candidate: {pkg['name']}@{version}")
          PY
      - name: Verify portable installer and legacy ownership paths
        run: python tools/installer_smoke.py
      - name: Assemble deterministic npm distribution
        run: python tools/package_installer.py
      - name: Verify npm package structure and local binary
        shell: bash
        run: |
          npm pack --dry-run ./dist/ui-spec-installer.tgz --json > "$RUNNER_TEMP/pack-report.json"
          node -e "const r=require(process.argv[1]); if(r.length!==1 || r[0].name!=='ui-spec-studio' || !['bin/ui-spec.mjs','payload/skill/SKILL.md','README.md','LICENSE'].every(n=>r[0].files.some(f=>f.path===n)))process.exit(1);" "$RUNNER_TEMP/pack-report.json"
          npx --yes --offline "file://$PWD/dist/ui-spec-installer.tgz" --version | grep -F "ui-spec-studio $(cat VERSION)"
      - name: Check npm registration (public, read-only; never infer ownership from availability)
        shell: bash
        run: |
          set -euo pipefail
          response="$(npm view ui-spec-studio name version repository --json --prefer-online --fetch-retries=0 2>&1)" && code=0 || code=$?
          if [[ "$code" == 0 ]]; then
            printf 'REGISTRY_REGISTERED %s\n' "$response"
          elif grep -q E404 <<< "$response"; then
            echo 'NPM_BOOTSTRAP_REQUIRED: package not yet owned; first npm publish requires a logged-in account with 2FA'
          else
            echo "npm registry unavailable or returned a non-404 error: $response" >&2
            exit 1
          fi
      - name: Confirm exact candidate npm version by registry HTTP (read-only)
        shell: bash
        run: |
          set -euo pipefail
          state="$(python tools/npm_publish_preflight.py --tarball dist/ui-spec-installer.tgz)"
          case "$state" in
            NOT_PUBLISHED|ALREADY_PUBLISHED_MATCH) echo "REGISTRY_VERSION_PREFLIGHT $state" ;;
            *) echo "Unexpected npm registry state: $state" >&2; exit 1 ;;
          esac
      - name: Rehearse the account owner's SHA-256 verified first-publication flow
        shell: pwsh
        run: ./tools/bootstrap-npm.ps1 -DryRun
      - name: Verify public npm-named CLI when registry has the candidate release
        run: python tools/official_npm_smoke.py
      - name: Provide standalone npm bootstrap artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: official-npm-installer-candidate
          path: dist/ui-spec-installer.tgz
          if-no-files-found: error
          retention-days: 14

  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' && inputs.publish) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      # Do not configure registry-url here: setup-node adds an _authToken
      # placeholder to .npmrc and can short-circuit npm's OIDC exchange.
      # The official npm registry is selected explicitly by the CLI below.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require exact validated release and prevent stale-event publishing
        id: release_gate
        shell: bash
        env:
          EVENT_KIND: ${{ github.event_name }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$EVENT_KIND" == "workflow_run" && "$actual_sha" != "$VALIDATED_SHA" ]]; then
            echo 'A newer main commit superseded this validation run; skip npm publication'
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ver="$(cat VERSION)"
          if ! git fetch --depth=1 origin "refs/tags/v$ver:refs/tags/v$ver"; then
            if [[ "$EVENT_KIND" == "workflow_run" ]]; then
              echo 'No version tag for this validated main commit; skip npm publication'
              echo 'eligible=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Missing published tag v$ver" >&2
            exit 1
          fi
          if [[ "$actual_sha" != "$(git rev-parse "v$ver^{commit}")" ]]; then
            if [[ "$EVENT_KIND" == "workflow_run" ]]; then
              echo 'Version tag does not match this commit; no new npm version to publish'
              echo 'eligible=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo 'Manual npm publish requires the exact tagged release commit' >&2
            exit 1
          fi
          if [[ "$(gh release view "v$ver" --json isDraft --jq '.isDraft')" != 'false' ]]; then
            echo "GitHub release v$ver is not publicly published" >&2
            exit 1
          fi
          echo 'eligible=true' >> "$GITHUB_OUTPUT"
      - name: Check npm bootstrap ownership and prevent package name hijacking
        id: registry_gate
        if: steps.release_gate.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          response="$(npm view ui-spec-studio name repository --json --prefer-online --fetch-retries=0 2>&1)" && code=0 || code=$?
          if [[ "$code" != 0 ]]; then
            if grep -q E404 <<< "$response"; then
              echo 'First npm registration still needed; see docs/NPM-DISTRIBUTION.md'
              echo 'registered=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "npm registry read failed: $response" >&2
            exit 1
          fi
          node -e '
            const r = JSON.parse(process.argv[1]);
            const repo = typeof r.repository === "string" ? r.repository : r.repository?.url;
            const url = repo?.replace(/^git\+/, "").replace(/\.git$/, "");
            if(r.name !== "ui-spec-studio" || url !== "https://github.com/D1ChangGeng/UI-Spec-Studio") {
              console.error("npm package identity mismatch; refusing to publish to a different owner/package");
              process.exit(1);
            }
          ' "$response"
          echo 'registered=true' >> "$GITHUB_OUTPUT"
      - name: Build byte-identical npm artifact
        if: steps.release_gate.outputs.eligible == 'true' && steps.registry_gate.outputs.registered == 'true'
        run: python tools/package_installer.py
      - name: Publish only a new or byte-identical npm version
        if: steps.release_gate.outputs.eligible == 'true' && steps.registry_gate.outputs.registered == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          # Only an exact public HTTP 404 establishes that a version is absent.
          # Do not turn npm view's null/JSON/error text into an integrity conflict.
          outcome="$(python tools/npm_publish_preflight.py --tarball dist/ui-spec-installer.tgz)"
          case "$outcome" in
            NOT_PUBLISHED)
              npm publish ./dist/ui-spec-installer.tgz --access public --registry https://registry.npmjs.org
              echo "PUBLISH_ACCEPTED: ui-spec-studio@$version"
              ;;
            ALREADY_PUBLISHED_MATCH)
              echo "ALREADY_PUBLISHED_VERIFIED: ui-spec-studio@$version (no duplicate publish)"
              ;;
            *)
              echo "Unexpected preflight outcome; refusing npm publication: $outcome" >&2
              exit 1
              ;;
          esac
      - name: Verify exact public npm metadata and latest with bounded retries
        if: steps.release_gate.outputs.eligible == 'true' && steps.registry_gate.outputs.registered == 'true'
        run: python tools/npm_registry_readback.py --tarball dist/ui-spec-installer.tgz
      - name: Verify public npm-named CLI and reversible legacy migration
        if: steps.release_gate.outputs.eligible == 'true' && steps.registry_gate.outputs.registered == 'true'
        run: python tools/official_npm_smoke.py --require-published
