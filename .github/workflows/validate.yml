name: Validate and release
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the tested VERSION from main
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ui-spec-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python tools/validate_package.py
      - run: python tools/catalog_docs.py --check
      - run: python -m unittest discover -s tests -v
      - run: python tools/package.py
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install local source
        run: python tools/install_smoke.py --source "$GITHUB_WORKSPACE"
      - name: Install committed remote source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python tools/install_smoke.py --source "https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA}"
  publication:
    # Playwright 1.57's dependency definitions support this fixed OS release.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r tools/requirements-preview.txt
      - name: Use the Ubuntu archive for system dependencies
        shell: bash
        run: |
          for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources /etc/apt/apt-mirrors.txt; do
            if [[ -f "$apt_source" ]]; then
              sudo sed -i -E \
                's@(https?://)azure\.archive\.ubuntu\.com/ubuntu([/[:space:]]|$)@\1archive.ubuntu.com/ubuntu\2@g' \
                "$apt_source"
            fi
          done
      - run: python -m playwright install-deps chromium
      - name: Provision the verified browser and recorder
        id: browser
        run: |
          python tools/provision_preview_browser.py \
            --output-dir "$RUNNER_TEMP/ui-spec-preview-browser" \
            --report publication-evidence/browser-provision.json \
            --github-output "$GITHUB_OUTPUT"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$RUNNER_TEMP/ui-spec-preview-browser" >> "$GITHUB_ENV"
      - name: Install CJK fonts for README locales
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python tools/readme_art.py --check
      - name: Local publication rendering
        run: python tools/preview_readme.py --output-dir publication-evidence/local --browser-path "${{ steps.browser.outputs.browser_path }}"
      - name: Published-source GitHub rendering
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python tools/preview_readme.py --output-dir publication-evidence/github --live-commit "$GITHUB_SHA" --browser-path "${{ steps.browser.outputs.browser_path }}"
      - name: Store publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication-evidence
          path: publication-evidence/
          if-no-files-found: error
          retention-days: 30
  scenario:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install -r tools/requirements-preview.txt
      - name: Use the Ubuntu archive for system dependencies
        shell: bash
        run: |
          for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources /etc/apt/apt-mirrors.txt; do
            if [[ -f "$apt_source" ]]; then
              sudo sed -i -E \
                's@(https?://)azure\.archive\.ubuntu\.com/ubuntu([/[:space:]]|$)@\1archive.ubuntu.com/ubuntu\2@g' \
                "$apt_source"
            fi
          done
      - run: python -m playwright install-deps chromium
      - name: Provision the verified browser and recorder
        id: browser
        run: |
          python tools/provision_preview_browser.py \
            --output-dir "$RUNNER_TEMP/ui-spec-preview-browser" \
            --report scenario-evidence/browser-provision.json \
            --github-output "$GITHUB_OUTPUT"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$RUNNER_TEMP/ui-spec-preview-browser" >> "$GITHUB_ENV"
      - name: Install CJK fonts for the declared sample locale
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Exercise product intent and resource decisions
        run: python tools/validate_scenario.py --output-dir scenario-evidence --browser-path "${{ steps.browser.outputs.browser_path }}"
      - name: Exercise visual asset delivery
        run: python tools/validate_assets.py --output-dir scenario-evidence/assets --browser-path "${{ steps.browser.outputs.browser_path }}"
      - name: Exercise bilingual content and UX writing
        run: python tools/validate_content.py --output-dir scenario-evidence/content --browser-path "${{ steps.browser.outputs.browser_path }}"
      - name: Capture and check temporal interaction episodes
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ steps.browser.outputs.browsers_path }}
        run: python tools/validate_temporal.py --output-dir scenario-evidence/temporal --browser-path "${{ steps.browser.outputs.browser_path }}"
      - name: Store scenario evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-intent-evidence
          path: scenario-evidence/
          if-no-files-found: error
          retention-days: 30
  release:
    needs: [test, install, publication, scenario]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Determine release scope
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os, subprocess
          before = os.environ.get('BEFORE', '')
          if os.environ['EVENT_NAME'] == 'workflow_dispatch' or not before.strip('0'):
              changed = True
          else:
              files = subprocess.check_output(['git', 'diff', '--name-only', before, 'HEAD'], text=True).splitlines()
              changed = 'VERSION' in files
          if not changed:
              version = open('VERSION', encoding='utf-8').read().strip()
              tag = subprocess.run(['git', 'show-ref', '--verify', '--quiet', f'refs/tags/v{version}']).returncode
              if tag not in (0, 1):
                  raise SystemExit('Could not inspect current version tag')
              changed = tag == 1
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'publish={str(changed).lower()}\n')
          PY
      - name: Publish and verify release assets
        if: steps.scope.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish.py --owner "${GITHUB_REPOSITORY_OWNER}" --name "${GITHUB_REPOSITORY#*/}" --execute
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.scope.outputs.publish == 'true'
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install published version
        if: steps.scope.outputs.publish == 'true'
        run: python tools/install_smoke.py --source "https://github.com/${GITHUB_REPOSITORY}/tree/v$(cat VERSION)"
