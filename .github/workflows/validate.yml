name: Validate and release
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the tested VERSION from main
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ui-spec-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python tools/validate_package.py
      - run: python -m unittest discover -s tests -v
      - run: python tools/package.py
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install local source
        run: python tools/install_smoke.py --source "$GITHUB_WORKSPACE"
      - name: Install committed remote source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python tools/install_smoke.py --source "https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA}"
  release:
    needs: [test, install]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Determine release scope
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os, subprocess
          before = os.environ.get('BEFORE', '')
          if os.environ['EVENT_NAME'] == 'workflow_dispatch' or not before.strip('0'):
              changed = True
          else:
              files = subprocess.check_output(['git', 'diff', '--name-only', before, 'HEAD'], text=True).splitlines()
              changed = 'VERSION' in files
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'publish={str(changed).lower()}\n')
          PY
      - name: Publish and verify release assets
        if: steps.scope.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish.py --owner "${GITHUB_REPOSITORY_OWNER}" --name "${GITHUB_REPOSITORY#*/}" --execute
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.scope.outputs.publish == 'true'
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install published version
        if: steps.scope.outputs.publish == 'true'
        run: python tools/install_smoke.py --source "https://github.com/${GITHUB_REPOSITORY}/tree/v$(cat VERSION)"
