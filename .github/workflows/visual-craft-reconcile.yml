name: Visual craft reconciliation
on:
  push:
    branches: [work/visual-craft-reconcile-20261028]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Apply exact additive reconciliation
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,lzma,pathlib,shutil,subprocess
          baseline='1ba50b1e1c6dfbd5540d9b54514ef81ac6160eec'
          subprocess.run(['git','merge-base','--is-ancestor',baseline,'HEAD'],check=True)
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          raw=pathlib.Path('.development/reconcile.xz').read_bytes()
          assert len(raw)==12972
          assert hashlib.sha256(raw).hexdigest()=='be0f9ced338d2d277bb0a1b408e1f10c668075ee0b85c0ecbe485f61a96129e3'
          source=lzma.decompress(raw)
          assert len(source)==31028
          assert hashlib.sha256(source).hexdigest()=='3fcbc106a517931447bb28539da4673709c00ab5bf89df2491f3e0e1d0a39862'
          script=pathlib.Path('.development/reconcile.py');script.write_bytes(source)
          subprocess.run(['python',str(script)],check=True)
          pathlib.Path('.github/workflows/visual-craft-reconcile.yml').unlink()
          shutil.rmtree('.development')
          subprocess.run(['git','add','-A'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='58927ff12a27b5208b3e37260ee3bb5f401437b7',tree
          print('Exact reconciled source tree:',tree)
          PY
          python tools/validate_package.py
          python tools/catalog_docs.py --check
          python tools/readme_art.py --check
          python -m unittest discover -s tests -v
          git diff --cached --check
          python tools/package.py
      - name: Verify exact artifacts and commit reconciliation branch only
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,pathlib
          expected={
           'ui-spec-studio-1.16.1.zip':'1099e594d8cb9891bed267a63f864f1461ce4166027f4ec92bf3cba9ae6e0271',
           'ui-spec-1.16.1.zip':'95cf191a243504cced85563f39950f26e9563d6bc7974585e8ac9e0858fca606',
           'contents.json':'47ddd5feb73a7cdd8a01e3a80cc508eebc53379f344eae0e098cd0858ae958ca',
           'SHA256SUMS.txt':'808295ae499b17923911ad2785f7f43b7c5257f3ed59ea6f30c0168663ddfc0b'}
          for name,want in expected.items():
           got=hashlib.sha256((pathlib.Path('dist')/name).read_bytes()).hexdigest()
           assert got==want,(name,got,want)
           print(name,got)
          assert not pathlib.Path('.development').exists()
          assert not pathlib.Path('.github/workflows/visual-craft-reconcile.yml').exists()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Prepare v1.16.1: preserve concurrent craft release and add query/task evidence'
          git push origin HEAD:refs/heads/work/visual-craft-reconcile-20261028
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-spec-1.16.1-reviewed-candidate
          path: dist/
          retention-days: 14
