name: Apply reviewed visual-craft candidate
on:
  push:
    branches: [work/visual-craft-v1.16-release]
permissions:
  contents: write
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Apply exact reviewed patch
        shell: bash
        run: |
          python - <<'PY'
          import base64,hashlib,lzma,pathlib,subprocess
          baseline='a89091dfa5754f98b79655c684f978f24fd92716'
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()==baseline
          assert subprocess.check_output(['git','rev-parse',baseline+'^{tree}'],text=True).strip()=='03e3c14508244551a18711aff28363452871e2ed'
          payload=pathlib.Path('.development/release-patch.b64').read_text(encoding='ascii')
          assert len(payload)==178384
          compressed=base64.b64decode(payload,validate=True)
          assert hashlib.sha256(compressed).hexdigest()=='5de929b0e2bc1e1b5032d2ef3c3704caf6d2346eb96b4e1d13760d94f8336677'
          patch=lzma.decompress(compressed)
          assert len(patch)==462631
          assert hashlib.sha256(patch).hexdigest()=='26b3d6066c640979bdec6b608bd0ae1fef96bb76e61836ce83e98e9ee2e04d1a'
          destination=pathlib.Path('/tmp/v116-reviewed.patch')
          destination.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(destination)],check=True)
          subprocess.run(['git','apply',str(destination)],check=True)
          source=pathlib.Path('docs/evidence/v1.16.0/application-capture-driver.txt')
          old=source.read_bytes()
          assert old.endswith(b'\n\n')
          source.write_bytes(old[:-1])
          pathlib.Path('.development/release-patch.b64').unlink()
          pathlib.Path('.development').rmdir()
          pathlib.Path('.github/workflows/visual-craft-release-prep.yml').unlink()
          subprocess.run(['git','add','-A'],check=True)
          actual=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert actual=='79ac9d46be92d8894794034475c994ccee8a8ec5',(actual,'unexpected candidate source tree')
          subprocess.run(['git','diff','--cached','--check'],check=True)
          print('Exact reviewed candidate tree:',actual)
          PY
      - name: Validate the candidate and reproducible packages
        shell: bash
        run: |
          python tools/validate_package.py
          python tools/catalog_docs.py --check
          python tools/readme_art.py --check
          python -m unittest discover -s tests -v
          python tools/package.py
          python - <<'PY'
          import hashlib,pathlib
          expected={
            'ui-spec-studio-1.16.0.zip':'ae3f94662b3ba1ef761c13acbf8d66d04ad7fad7c892534cddfa4820ab45f1ca',
            'ui-spec-1.16.0.zip':'d2c3a56c8ec3e6031a98d4faee58d4bd36b6e1ed38054eedfc566aab226939cc',
            'contents.json':'817d21884b598ffb4ebaea978623057427dd1515f529068e0d75d36e31474426',
            'SHA256SUMS.txt':'1451b2c90ed5507fc169f3e254828f406b0c08c43fd45ff2293646d00e0af75c'
          }
          for file,digest in expected.items():
            actual=hashlib.sha256((pathlib.Path('dist')/file).read_bytes()).hexdigest()
            assert actual==digest,(file,actual,digest)
            print(file,actual)
          PY
      - name: Commit reviewed source to development branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Prepare v1.16.0: mature visual craft reuse and verified evidence'
          git push origin HEAD:refs/heads/work/visual-craft-v1.16-release
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v116-reviewed-dist
          path: dist/
          retention-days: 7
