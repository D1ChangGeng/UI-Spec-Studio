name: Visual craft task trials
on:
  push:
    branches: [work/visual-craft-evaluation-20261028]
permissions:
  contents: read
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Build isolated source-adoption trials
        run: python .research/build.py
      - name: Exercise actual browser conditions
        run: |
          python -m pip install -r tools/requirements-preview.txt
          python -m playwright install --with-deps chromium
          python .research/capture.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: actual-source-trials
          path: /tmp/craft-tasks/
          retention-days: 7
