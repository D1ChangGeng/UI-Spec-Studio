<!doctype html>
<html lang="zh-CN" data-theme="light" data-density="comfortable">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Leafnote — a quiet, browser-local research notebook."><title>Leafnote · 研究笔记</title><link rel="stylesheet" href="vendor/pico.min.css"><link rel="stylesheet" href="styles.css"></head>
<body>
<a class="skip" href="#note-title" data-i18n="skip">跳到编辑器</a>
<header class="site-header"><a class="brand" href="./" aria-label="Leafnote"><span class="brand-mark" aria-hidden="true">l.</span><span>leafnote<span class="brand-description" data-i18n="notebook">研究笔记本</span></span></a><div class="density-control"><label for="density" data-i18n="densityLabel">阅读密度</label><select id="density"><option value="comfortable" data-i18n="comfortable">舒适</option><option value="compact" data-i18n="compact">紧凑</option></select></div><div class="utilities"><span class="local-label"><span class="dot"></span><span data-i18n="local">仅此浏览器</span></span><button id="locale-toggle" class="quiet">EN</button><button id="theme-toggle" class="quiet" aria-label="切换深色主题">◐</button></div></header>
<main class="workspace">
<aside id="collection" class="collection" aria-labelledby="collection-title">
<div class="collection-head"><div><p class="eyebrow" data-i18n="workspace">研究空间</p><h1 id="collection-title" data-i18n="allNotes">所有笔记</h1></div><button id="new-note" class="new-button" data-i18n="new">＋ 新建</button></div>
<label class="sr-only" for="search" data-i18n="search">搜索笔记</label><input id="search" type="search" placeholder="搜索标题、背景或正文…" autocomplete="off"><div class="list-meta"><span id="result-count" role="status"></span><span data-i18n="recent">最近修改</span></div>
<div id="note-list" class="note-list"></div>
<div id="list-empty" class="list-empty"><span aria-hidden="true">↳</span><h2 id="empty-title"></h2><p id="empty-copy"></p><button id="examples" class="secondary outline" data-i18n="examples">试用示例笔记</button><button id="collection-retry" class="secondary outline" hidden data-i18n="retry">重试</button><button id="clear-search" class="secondary outline" hidden data-i18n="clearSearch">清除搜索</button></div>
<div class="collection-footer"><button id="export" class="quiet export-button" data-i18n="export">↓ 导出备份</button><p data-i18n="boundary">笔记保存在此浏览器中，不会同步到其他设备。请定期导出备份。</p></div>
</aside>
<section id="editor" class="editor" aria-label="笔记编辑器"><div class="editor-toolbar"><button id="back" class="quiet" data-i18n="back">← 所有笔记</button><div class="breadcrumb"><span data-i18n="notebook">研究笔记本</span><span>/</span><span id="editor-mode"></span></div><div class="editor-tools"><button id="delete" class="quiet danger-text" data-i18n="delete">删除</button><button id="save" data-i18n="save" type="submit" form="note-form">保存笔记</button></div></div>
<div class="feedback" id="feedback"><p id="state-message" role="status" aria-live="polite" aria-atomic="true"></p><button id="retry" class="secondary outline" hidden data-i18n="retry">重试</button></div>
<div class="writing-surface"><div class="note-kicker"><span class="eyebrow" data-i18n="researchNote">研究笔记</span><span id="sample-label" class="sample-label" hidden data-i18n="sample">虚构示例</span></div>
<form id="note-form" novalidate><label class="field-label" for="note-title" data-i18n="titleLabel">标题</label><textarea id="note-title" rows="2" maxlength="150" aria-required="true" aria-describedby="title-error" placeholder="一个值得追问的问题"></textarea><p id="title-error" class="error" role="alert" hidden></p>
<div class="context-row"><label for="note-context" data-i18n="contextLabel">项目 / 背景</label><input id="note-context" maxlength="160" placeholder="例如：城市能源 · 文献梳理"></div>
<div class="body-heading"><label for="note-body" data-i18n="bodyLabel">背景与线索</label><span data-i18n="optional">选填</span></div><textarea id="note-body" rows="13" maxlength="30000" placeholder="从问题开始。记下观察、材料和下一步需要核查的内容…"></textarea>
<div class="note-bottom"><span id="word-count"></span><span id="updated"></span></div></form>

<div class="writing-foot"><span class="dot"></span><span data-i18n="draftHint">切换笔记时会保留草稿；点击保存以更新笔记。</span><kbd>⌘ / Ctrl S</kbd></div>
</div></section></main>
<dialog id="delete-dialog" aria-labelledby="delete-heading" aria-describedby="delete-description"><article><p class="eyebrow" data-i18n="deleteEyebrow">删除笔记</p><h2 id="delete-heading" data-i18n="deleteHeading">删除这份笔记？</h2><p id="delete-name" class="delete-name"></p><p id="delete-description" data-i18n="deleteDescription">这会删除此浏览器中的笔记及其草稿。此操作无法撤销。</p><p id="delete-error" class="error" role="alert" hidden></p><footer><button id="cancel-delete" class="secondary outline" autofocus data-i18n="cancel">取消</button><button id="confirm-delete" class="destructive" data-i18n="confirmDelete">删除笔记</button></footer></article></dialog>
<footer id="test-controls" hidden><label><input id="simulate-failure" type="checkbox">Simulate write failure</label><label><input id="simulate-slow" type="checkbox">Delay save 1 second</label></footer>
<script src="app.js"></script></body></html>
